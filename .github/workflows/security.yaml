name: security

# 横断的なCI検証（アプリ個別のci.yaml / patient-ci.yaml / hospital-ci.yaml を補完）。
# - Secret誤コミット検出（gitleaks）
# - 依存脆弱性スキャン（npm audit / Dart OSV）
# - コンテナ脆弱性スキャン（Trivy）
# - firebase.json / Firestore・Storage Rules / インデックス定義の検証
# 参照: Issue #37 / #47、docs/06 §10、docs/02 §13.1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks が履歴走査できるよう全履歴を取得
          fetch-depth: 0

      - name: Reject tracked local environment files
        run: python3 scripts/check-secret-paths.py

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_ASSET_ID: '202338480' # Official v8.21.2 linux_x64 release asset
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          # The release download frontend can return 504; use the official asset API.
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --header 'Accept: application/octet-stream' \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}" \
            --output /tmp/gitleaks.tar.gz
          printf '%s  /tmp/gitleaks.tar.gz\n' "$GITLEAKS_SHA256" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  dependency-audit:
    name: dependency-audit / npm audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/api
          - apps/hospital
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: npm ci
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts

      # critical のみでCIを落とす（制御不能な推移的 moderate/high でPRを塞がない）。
      # high 以下は警告として残し、継続監視する。
      - name: Audit (critical fails)
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=critical

      - name: Audit report (high, informational)
        if: always()
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high || echo "::warning::high以上の脆弱性が検出されました（${{ matrix.package }}）"

  dart-dependency-audit:
    name: dependency-audit / Dart OSV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      # pub get only warns; OSV exits nonzero for any known advisory, including
      # advisories without severity. Scan the committed resolved versions.
      - name: Audit Dart lockfile (any advisory fails)
        run: osv-scanner scan source --lockfile=apps/patient/pubspec.lock

  container-audit:
    name: container-audit / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api/Dockerfile
            target: prod
          # The portal is deployed as static files to Firebase Hosting.
          # Its Docker image is used only for local development.
          - image: hospital-dev
            dockerfile: docker/hospital/Dockerfile
            target: dev
          - image: firebase-emulator
            dockerfile: docker/firebase/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v7
      - name: Build scan image (no push)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          args=()
          if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
          docker build --file "$DOCKERFILE" "${args[@]}" --tag "local/$IMAGE:scan" .
      - name: Smoke test Firebase emulators
        if: matrix.image == 'firebase-emulator'
        # Isolated demo ID: no real Firebase project or credentials are used.
        run: >-
          docker run --rm --entrypoint firebase local/firebase-emulator:scan
          emulators:exec --project demo-mmr --only auth,firestore,database,storage
          "echo emulator smoke passed"
      - name: Scan OS and application packages (critical fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: local/${{ matrix.image }}:scan
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

  firebase-config:
    name: firebase-config / rules + json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java (Firebase emulators requirement)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Validate JSON configuration files
        run: |
          for f in firebase.json .firebaserc firebase/firestore.indexes.json firebase/database.rules.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: Compile Firestore & Storage security rules
        # emulators:exec はルールを読み込んでコンパイルするため、
        # 構文エラーがあればここで失敗する。実プロジェクトには接続しない。
        run: npx -y firebase-tools@15.35.0 emulators:exec --only firestore,storage --project demo-mmr "echo rules compiled"

  firebase-rules-test:
    name: firebase-rules / emulator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - name: Set up Java (Firebase emulators requirement)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        working-directory: firebase/tests
        run: npm ci

      # チェックイン済み rules をエミュレータへロードし、許可/拒否を網羅検証する。
      # emulators:exec が FIRESTORE/FIREBASE_DATABASE/FIREBASE_STORAGE_EMULATOR_HOST を設定する。
      # プロジェクトは compose 既定と同じ demo-mmr-dev（singleProjectMode と整合）。
      # firebase-tools は docker/firebase/Dockerfile の FIREBASE_TOOLS_VERSION と揃える。
      - name: Run rules unit tests on emulators
        run: >-
          npx -y firebase-tools@15.35.0 emulators:exec
          --only firestore,database,storage --project demo-mmr-dev
          "npm --prefix firebase/tests test"

  workflow-lint:
    name: workflow-lint / yaml parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate workflow YAML syntax
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              try:
                  with open(path) as fh:
                      yaml.safe_load(fh)
                  print(f"ok: {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL: {path}\n{exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
