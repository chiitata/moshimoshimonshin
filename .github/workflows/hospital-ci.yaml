name: hospital-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hospital:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/hospital
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/hospital/package-lock.json
            services/api/package-lock.json
      - run: npm ci --prefix ../../services/api
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:security
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Chrome availability
        run: /usr/bin/google-chrome --version
      - name: Real browser and BE (Auth + Firestore + Next + Chrome)
        env:
          FIREBASE_PROJECT_ID: demo-mmr-dev
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18081
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:19199
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:19000
          HOSPITAL_CHROME_PATH: /usr/bin/google-chrome
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-mmr-dev --config ../../firebase.hospital-test.json --only auth,firestore 'npm run test:browser'
