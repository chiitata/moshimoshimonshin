name: hospital-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hospital:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hospital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hospital/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
