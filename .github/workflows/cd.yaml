name: cd

# API / Rules の配信。全5系統のmain CI成功後に、検証したSHAだけを配信する。
# Web: 病院はcd-hospital.yamlのNextサーバー配信。患者はEmulator専用のため対象外。
# stg/prodは既存GitHub Environmentの承認ラベルで、GCPは単一プロジェクト。

on:
  workflow_run:
    workflows: [ci, hospital-ci, patient-ci, security, storage-config]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先環境
        type: choice
        required: true
        options:
          - stg
          - prod
      action:
        description: 実行アクション
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - rollback
      rollback_revision:
        description: "rollback 時に 100% トラフィックを戻す Cloud Run リビジョン名（例: api-00042-abc）"
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write # WIF のトークン発行に必須

concurrency:
  # Both approval labels target the same project/service; serialize them together.
  group: cd-project-7efcc4c4-6c86-490c-ba5
  cancel-in-progress: false

env:
  GCP_REGION: asia-northeast1

jobs:
  gate:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v9
        id: check
        with:
          script: |
            const gate = require('./scripts/cd-gate.cjs');
            await gate({github, context, core});

  plan:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    name: plan / 構成の解決
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'stg' }} # ← ここで手動承認ゲートが働く
    outputs:
      sha: ${{ needs.gate.outputs.sha }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Resolve deploy plan
        id: vars
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_AR_REPO: ${{ vars.GCP_AR_REPO }}
          RUN_SERVICE_API: ${{ vars.RUN_SERVICE_API }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          for key in GCP_PROJECT_ID GCP_AR_REPO RUN_SERVICE_API GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            test -n "${!key}" || { echo "::error::Missing variable: $key"; exit 1; }
          done
          test "$GCP_PROJECT_ID" = project-7efcc4c4-6c86-490c-ba5 || exit 1
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPO}/${RUN_SERVICE_API}:${DEPLOY_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "## CD plan"
            echo "- environment: \`${{ inputs.environment || 'stg' }}\`"
            echo "- action: \`${{ inputs.action }}\`"
            echo "- region: \`${GCP_REGION}\`"
            echo "- commit: \`${DEPLOY_SHA}\`"
            echo "- image: \`${image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-api:
    name: build-api / イメージビルド＋push
    if: (inputs.action || 'deploy') == 'deploy'
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'stg' }}
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build API image (prod target)
        run: docker build -f docker/api/Dockerfile --target prod -t "${{ needs.plan.outputs.image }}" .

      - name: Push image
        run: docker push "${{ needs.plan.outputs.image }}"

  deploy-cloud-run:
    name: deploy-cloud-run / API サービス更新
    if: (inputs.action || 'deploy') == 'deploy'
    needs: [plan, build-api]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'stg' }}
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy new revision (no traffic)
        # 新リビジョンをトラフィック 0 で投入し、段階的に切替える（gradual rollout）
        run: |
          gcloud run deploy "${{ vars.RUN_SERVICE_API }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --image "${{ needs.plan.outputs.image }}" \
            --no-traffic \
            --revision-suffix "sha-${DEPLOY_SHA::12}" \
            --quiet

      - name: Shift traffic to new revision
        # この実行が作った正確なリビジョンへ切替える。to-latest は使わない。
        run: |
          gcloud run services update-traffic "${{ vars.RUN_SERVICE_API }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --to-revisions "${{ vars.RUN_SERVICE_API }}-sha-${DEPLOY_SHA::12}=100" \
            --quiet

      - name: Verify public API health
        run: |
          origin="$(gcloud run services describe "${{ vars.RUN_SERVICE_API }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --max-time 20 "$origin/health" -o /dev/null

  deploy-rules:
    name: deploy-rules / Firestore・Storage・RTDB
    if: (inputs.action || 'deploy') == 'deploy'
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'stg' }}
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy security rules & indexes
        # firebase-tools は WIF で得た GOOGLE_APPLICATION_CREDENTIALS を利用。
        # rules の更新は医療監修レビュー前提（§13.1-7）。
        run: |
          npx -y firebase-tools@15.35.0 deploy \
            --config firebase.deploy.json \
            --only firestore:rules,firestore:indexes,storage \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and verify existing status database rules
        run: python3 infra/storage/deploy_database_rules.py --project "${{ vars.GCP_PROJECT_ID }}"

  rollback:
    name: rollback / 前リビジョンへ切戻し
    if: (inputs.action || 'deploy') == 'rollback'
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'stg' }}
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
      ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
    steps:
      - name: Validate input
        run: |
          if [ -z "${ROLLBACK_REVISION}" ]; then
            echo "::error::rollback には rollback_revision（戻し先リビジョン名）が必須です"
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Shift 100% traffic to target revision
        run: |
          gcloud run services update-traffic "${{ vars.RUN_SERVICE_API }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --to-revisions "${ROLLBACK_REVISION}=100" \
            --quiet
          echo "::notice::Cloud Run を ${ROLLBACK_REVISION} へ 100% 切戻しました。Firestore/Storage rules は git revert → deploy-rules 再実行で戻してください。"

  notify:
    name: notify / 監査・通知
    if: always() && needs.gate.outputs.ready == 'true'
    needs: [gate, plan, build-api, deploy-cloud-run, deploy-rules, rollback]
    runs-on: ubuntu-24.04
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Compose deploy summary
        run: |
          {
            echo "## CD result: ${{ inputs.action }} → ${{ inputs.environment || 'stg' }}"
            echo "- commit: \`${DEPLOY_SHA}\`"
            echo "- actor: \`${{ github.actor }}\`"
            echo "- build-api: ${{ needs.build-api.result }}"
            echo "- deploy-cloud-run: ${{ needs.deploy-cloud-run.result }}"
            echo "- deploy-rules: ${{ needs.deploy-rules.result }}"
            echo "- rollback: ${{ needs.rollback.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook notification (optional)
        if: ${{ env.WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"CD ${{ inputs.action }} -> ${{ inputs.environment || 'stg' }} / ${DEPLOY_SHA} / run=${{ needs.deploy-cloud-run.result }}\"}" \
            || echo "::warning::通知 Webhook の送信に失敗しました"
