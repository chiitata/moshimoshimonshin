name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api / typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker / image build + compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build api image (all targets)
        run: docker build -f docker/api/Dockerfile .

      - name: Build firebase emulator image
        run: docker build -f docker/firebase/Dockerfile .

      - name: Validate docker-compose.yml
        run: docker compose config -q
