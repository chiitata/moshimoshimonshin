version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/api
      - /apps/hospital
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /apps/patient
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /docker/api
      - /docker/hospital
      - /docker/firebase
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
